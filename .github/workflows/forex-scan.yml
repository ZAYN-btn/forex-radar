
name: Forex Radar Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forex-radar-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli kütüphaneleri yükle
        run: pip install yfinance pandas requests

      - name: Forex taraması yap ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python forex_engine.py

      - name: Sinyal geçmişini kaydet
        run: |
          git config user.name "Forex Radar Bot"
          git config user.email "forex-radar-bot@users.noreply.github.com"
          git add signal_state.json
          git diff --cached --quiet || git commit -m "Update Forex Radar signal state"
          git push
