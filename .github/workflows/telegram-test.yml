
name: Telegram Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          if not token or not chat_id:
              raise SystemExit("Telegram secrets eksik!")

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          payload = {
              "chat_id": chat_id,
              "text": (
                  "FOREX RADAR\n\n"
                  "Telegram bağlantısı başarılı!\n"
                  "Otomatik analiz sistemi için bağlantı testi tamamlandı."
              )
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read())

          if not result.get("ok"):
              raise SystemExit("Telegram mesajı gönderilemedi!")

          print("Telegram bağlantısı başarılı!")
          PY
